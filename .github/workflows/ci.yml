name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout@v5
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
      # Resolve deps from the committed uv.lock (WI-028): a new ruff/mypy
      # release can no longer redden main with zero code change. --frozen
      # trusts the lockfile as-is (no fresh resolution); bump deps by
      # regenerating uv.lock, not by letting CI resolve anew.
      - run: uv venv
      - run: uv sync --frozen --extra dev

      - name: Identifier gate
        env:
          AGENT_SUITE_FORBIDDEN_IDENTIFIERS: ${{ secrets.AGENT_SUITE_FORBIDDEN_IDENTIFIERS }}
        run: |
          if [[ -z "${AGENT_SUITE_FORBIDDEN_IDENTIFIERS//[[:space:]]/}" ]]; then
            echo "::error::AGENT_SUITE_FORBIDDEN_IDENTIFIERS must be configured"
            exit 1
          fi
          uv run python scripts/check_committed_identifiers.py

      - name: Plan index check
        run: uv run python scripts/plan-index.py --check

      - name: Contract conformance check (WI-0.2)
        run: uv run python scripts/validate-contracts.py --check

      - name: Feature probes check (WI-0.1)
        # Non-strict structural check: detects status/proof drift on rows
        # whose probes CAN run (agent-suite rows). Sibling-component probes
        # return HAND_ASSESSED here (no sibling checkouts in this job) and
        # are reported as warnings, not failures. The strict check runs in
        # the feature-probes job below with all siblings checked out.
        run: uv run python scripts/feature-probes.py --check

      - name: Architecture test (import boundary)
        run: uv run pytest tests/test_architecture.py -q

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts/plan-index.py scripts/feature-matrix.py scripts/validate-contracts.py scripts/feature-probes.py scripts/check_committed_identifiers.py scripts/check-lock-agreement.py

      - name: Type check (mypy)
        run: uv run mypy --strict src scripts/feature-matrix.py scripts/validate-contracts.py

      - name: Run tests
        run: uv run pytest --tb=short -q

  # The hooks are shell, and agent-suite AUTHORS them for the whole estate — but
  # had no shellcheck job, so an SC2034 in githooks/pre-push was first discovered
  # by a downstream repo's CI after the sync had already been pushed to twenty
  # repositories. Validate them where they are written.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout@v5
      - name: ShellCheck the hooks and shell glue
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck githooks/pre-commit githooks/commit-msg githooks/pre-push \
                     scripts/install-git-hooks.sh scripts/agent-worktree

  # Commit messages are a publication channel the tracked-tree scan cannot see:
  # it reads files, so an identifier named only in a message is invisible to it.
  # That blind spot is not hypothetical — a sibling public repo carried
  # work-domain identifiers in three commit messages, two of which were the very
  # commits that redacted the same identifiers from the files. Separate job
  # because it needs full history (fetch-depth: 0) and the matrix job does not.
  message-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.12"
      - run: uv venv
      - run: uv sync --frozen --extra dev

      - name: Commit message identifier gate
        env:
          AGENT_SUITE_FORBIDDEN_IDENTIFIERS: ${{ secrets.AGENT_SUITE_FORBIDDEN_IDENTIFIERS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ -z "${AGENT_SUITE_FORBIDDEN_IDENTIFIERS//[[:space:]]/}" ]]; then
            echo "::error::AGENT_SUITE_FORBIDDEN_IDENTIFIERS must be configured"
            exit 1
          fi
          # On a PR scan the branch's own commits; on a push scan what arrived.
          if [[ -n "$BASE_SHA" ]]; then
            range="$BASE_SHA..HEAD"
          elif [[ -n "$BEFORE_SHA" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            range="$BEFORE_SHA..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "scanning commit messages in $range"
          uv run python scripts/check_committed_identifiers.py --rev-range "$range"

  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: interop
          POSTGRES_PASSWORD: interop_pw
          POSTGRES_DB: interop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interop"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    env:
      INTEROP_DSN: postgresql://interop:interop_pw@localhost:5432/interop
      # Make the face-level interop test a hard gate: if the face packages don't
      # install, the test errors (not skips), so a packaging regression is a red
      # run, not a silent skip (Plan 002 WI-2).
      INTEROP_REQUIRE_FACES: "1"
      # Component revisions AND repository origins are NOT literals here.
      # SUITE.lock is the single source of truth (Plan 015 WI-2.2 / release-
      # truth / Sol CI finding): the "Resolve pinned origins and revisions from
      # SUITE.lock" step below reads the lock and exports <NAME>_REPO and
      # <NAME>_SHA (REGISTA / AGENT_NOTES / DOSSIER / CAIRN) to GITHUB_ENV. A
      # second set of literal SHAs or hard-coded origins drifts (the agent-notes
      # SHA literal did in 2026-07) — advance a pin by updating SUITE.lock,
      # never by re-adding a literal here.

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout@v5
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 18 client tools
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      # agent-suite + its dev deps come from the frozen lock (WI-028); the
      # sibling components below are pinned-SHA pip installs into the same venv.
      - run: uv venv
      - run: uv sync --frozen --extra dev

      # SUITE.lock is the single source of truth for BOTH the repository origin
      # and the revision of every interop (Profile B) component (release-truth /
      # Sol CI finding). Export <NAME>_REPO and <NAME>_SHA to GITHUB_ENV so the
      # install + schema steps below use exactly the locked origin@revision —
      # there are no literal SHAs and no hard-coded org/repo origins in this job
      # to drift out of sync with the lock (and no work-domain identifier for
      # the identifier gate to flag).
      - name: Resolve pinned origins and revisions from SUITE.lock
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          from pathlib import Path
          comp = tomllib.loads(Path("SUITE.lock").read_text(encoding="utf-8"))["components"]
          # agent-provenance's package/CLI name is cairn, hence the CAIRN prefix.
          print(f"REGISTA_REPO={comp['regista']['repo']}")
          print(f"REGISTA_SHA={comp['regista']['revision']}")
          print(f"AGENT_NOTES_REPO={comp['agent-notes']['repo']}")
          print(f"AGENT_NOTES_SHA={comp['agent-notes']['revision']}")
          print(f"DOSSIER_REPO={comp['dossier']['repo']}")
          print(f"DOSSIER_SHA={comp['dossier']['revision']}")
          print(f"CAIRN_REPO={comp['agent-provenance']['repo']}")
          print(f"CAIRN_SHA={comp['agent-provenance']['revision']}")
          PY

      - name: Install regista (spine)
        # Install from the exact SUITE.lock source revision, not a version-only
        # PyPI wheel: a tested-candidate freeze (Plan 015 WI-2.2) requires the
        # interop set to BE the locked candidate, and a PyPI version (e.g. 0.5.3)
        # can be built from a commit other than the pinned revision. The git
        # origin and revision are both read from the lock (no org literal
        # hardcoded here, so the identifier gate stays satisfied) — SUITE.lock is
        # the single source of truth for both the repo and the revision.
        run: uv pip install "git+https://github.com/${REGISTA_REPO}.git@${REGISTA_SHA}"

      # Both face repos are public — install as a hard required step. If the
      # install fails, CI fails: combined with INTEROP_REQUIRE_FACES=1 above,
      # the face-level interop proof can no longer silently regress to a skip
      # (Plan 002 WI-1). Origins and revisions are lock-derived.
      - name: Install faces (agent-notes + dossier)
        run: |
          uv pip install --no-sources \
                       "git+https://github.com/${AGENT_NOTES_REPO}.git@${AGENT_NOTES_SHA}" \
                       "git+https://github.com/${DOSSIER_REPO}.git@${DOSSIER_SHA}"

      - name: Install agent-provenance (cairn)
        run: uv pip install --no-sources "git+https://github.com/${CAIRN_REPO}.git@${CAIRN_SHA}"

      - name: Set up agent-notes schema (skill-smoke prerequisite)
        run: |
          # agent-notes uses TWO stores (agent-notes core/config.py two-DSN
          # contract): the domain DB (its own public.projects/workspaces) and a
          # SEPARATE regista store (regista's public.projects catalog + per-
          # project event schemas). The two public.projects shapes collide in
          # one DB, so the smoke suite needs two databases.
          #   - agent_notes_smoke:         domain schema applied below
          #   - agent_notes_smoke_regista: pure regista store, provisioned on
          #                                the fly by regista.create_project
          psql "$INTEROP_DSN" -c "CREATE DATABASE agent_notes_smoke;" || true
          psql "$INTEROP_DSN" -c "CREATE DATABASE agent_notes_smoke_regista;" || true
          # Fetch the EXACT pinned SHA (depth 1) and fail loudly on a bad pin.
          # A `git clone --depth 1` only fetches the default-branch tip, so a
          # `checkout $SHA || true` would silently no-op when the pin isn't the
          # tip and apply main's schema instead — defeating the lock. Fetching
          # the SHA directly makes an unreachable/wrong pin a hard error.
          git init --quiet /tmp/an-src
          git -C /tmp/an-src remote add origin "https://github.com/${AGENT_NOTES_REPO}.git"
          git -C /tmp/an-src fetch --quiet --depth 1 origin "$AGENT_NOTES_SHA"
          git -C /tmp/an-src checkout --quiet "$AGENT_NOTES_SHA"
          SMOKE_DSN="postgresql://interop:interop_pw@localhost:5432/agent_notes_smoke"
          for f in /tmp/an-src/schema/*.sql; do
            psql "$SMOKE_DSN" -f "$f" 2>&1 | grep -v "^CREATE\|^ALTER\|^INSERT\|^DROP\|^SET\|^--" || true
          done
          echo "agent-notes domain schema applied to agent_notes_smoke"

      - name: Run interop + tamper + restore-drill + adversarial-corpus + skill-smoke tests
        env:
          AGENT_NOTES_SMOKE_DSN: postgresql://interop:interop_pw@localhost:5432/agent_notes_smoke
          AGENT_NOTES_SMOKE_REGISTA_DSN: postgresql://interop:interop_pw@localhost:5432/agent_notes_smoke_regista
        run: uv run pytest tests/test_interop.py tests/test_tamper.py tests/test_restore_drill.py tests/test_adversarial_corpus.py tests/test_skill_smoke.py -v --tb=short

  # Plan 015 WI-0.1 — strict feature-probe verification with all sibling
  # components checked out at SUITE.lock-pinned revisions. Prevents the
  # false-green where missing siblings produce HAND_ASSESSED that preserves
  # committed status (Sol round-3 finding #1). Revisions are parsed from
  # SUITE.lock so the lock file is the single source of truth — no third
  # set of env-var SHAs to drift out of sync with the interop pins.
  feature-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout@v5
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.12"

      - run: uv venv
      - run: uv sync --frozen --extra dev

      - name: Checkout sibling components at SUITE.lock-pinned revisions
        run: |
          mkdir -p /tmp/siblings
          uv run python -c "
          import tomllib, subprocess
          from pathlib import Path
          lock = tomllib.loads(Path('SUITE.lock').read_text())
          for name, info in lock['components'].items():
              repo = info['repo']
              rev = info['revision']
              dest = Path('/tmp/siblings') / name
              subprocess.run(['git', 'clone', '--quiet', f'https://github.com/{repo}.git', str(dest)], check=True)
              subprocess.run(['git', '-C', str(dest), 'checkout', rev], check=True)
              print(f'  {name} @ {rev[:8]}')
          "

      # Cross-repo lock-agreement (Plan 019 B2-generalize): every member's
      # face-local SUITE.lock [spine] must equal the umbrella
      # [components.regista]. The siblings are checked out at the umbrella-pinned
      # revisions above, so this reads each one's vendored [spine] and fails on
      # drift. Runs before the installs so a spine disagreement surfaces first.
      - name: Check cross-repo lock agreement
        env:
          AGENT_SUITE_SIBLINGS_ROOT: /tmp/siblings
        run: uv run python scripts/check-lock-agreement.py

      - name: Install regista (spine)
        run: uv pip install /tmp/siblings/regista

      - name: Install faces (agent-notes + dossier)
        run: uv pip install /tmp/siblings/agent-notes /tmp/siblings/dossier

      - name: Install agent-provenance (cairn)
        run: uv pip install /tmp/siblings/agent-provenance

      - name: Install agent-capability-broker
        run: uv pip install /tmp/siblings/agent-capability-broker

      # agent-wake has no importable package (package=None in the probe
      # revision sources); only its source checkout is needed for the
      # source-based and CLI-based probes. It was cloned above.

      - name: Run feature-probe check (strict)
        env:
          AGENT_SUITE_SIBLINGS_ROOT: /tmp/siblings
        run: uv run python scripts/feature-probes.py --check --strict

  # Plan 003 WI-5.1 — prove agent-suite imports and unit tests pass on native
  # Windows. agent-suite is stdlib-only, so this is primarily a guard against
  # future non-portable additions (os.O_NOFOLLOW, fcntl, etc.). Integration
  # tests (interop/tamper/restore-drill) skip cleanly — no Docker or Postgres
  # on the windows-latest runner.
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 10

    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout@v5
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv venv
      - run: uv sync --frozen --extra dev

      - name: Architecture test (import boundary)
        run: uv run pytest tests/test_architecture.py -q

      - name: Contract conformance check (WI-0.2)
        run: uv run python scripts/validate-contracts.py --check

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts/plan-index.py scripts/feature-matrix.py scripts/validate-contracts.py scripts/feature-probes.py scripts/check_committed_identifiers.py scripts/check-lock-agreement.py

      - name: Type check (mypy)
        run: uv run mypy --strict src scripts/feature-matrix.py scripts/validate-contracts.py

      - name: Run tests
        run: uv run pytest --tb=short -q
