name: Release artifacts

# Generates two release-time artifacts on tag push and attaches them to the
# GitHub release:
#
# 1. ``data/candidate-inventory.json`` — the operator-specific live estate
#    state (current-state read of checkouts + suite.env). A committed
#    snapshot in the main branch would always be self-stale (committing it
#    changes the umbrella HEAD it just snapshotted — see Sol round-2/3
#    finding #2). Generating it in CI against the tagged release revision
#    is the canonical path.
#
#    Sol round-3 finding #2: the release workflow must produce proof of a
#    clean, tested source candidate, not just deployment metadata. Sibling
#    components are checked out at SUITE.lock-pinned revisions, the
#    feature-probe strict check must pass, and source_tree_converged must
#    be true before the inventory is attached to the release. Until Gate 2
#    (release-board WI-2.3) builds immutable wheels, the attached inventory
#    therefore describes a *source* candidate (locked source revisions), not a
#    wheel/bundle candidate — it is honest about being pre-immutability.
#
# 2. ``release-manifest.json`` — the release-time description of the SOURCE
#    candidate (Sol Gate 0 / Workstream 2). Until Gate 2 (release-board
#    WI-2.3) builds immutable wheels/bundle, the candidate is a *source*
#    candidate — the SUITE.lock-pinned source revisions, checked out and
#    tested; there are no immutable wheel artifacts yet and the manifest does
#    NOT claim wheel reproducibility. It records the umbrella tag SHA, all six
#    constituent source SHAs, package versions, the lock identity, and
#    (forward-compatibly) wheel / source-archive hashes. The manifest is
#    distinct from the inventory: the manifest describes the candidate that was
#    cut; the inventory describes what the operator's estate looks like right
#    now. The two bind via ``Inventory.bind_to_manifest``. "Immutable" here
#    refers to the manifest record (a tamper-evident self-SHA over its
#    content), not to the candidate: the record is immutable, the candidate is
#    a source candidate until Gate 2 produces immutable wheels.
#
#    The wheel-build step is NOT yet wired in CI — the manifest's
#    ``wheel_sha256`` and ``source_archive_sha256`` fields honestly
#    record empty strings ("not provided"). Gate 2 (release-board WI-2.3) will
#    add the wheel-build step; the manifest schema is forward-compatible
#    (empty strings are explicit "not provided", not "failed to compute").
#
# Triggers only on tag pushes matching ``v*``. Both artifacts are uploaded
# to the release; the main branch never carries them.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout@v5
        with:
          # Full history so the origin probe can compare against main.
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent-suite
        run: pip install -e ".[dev]"

      - name: Checkout sibling components at SUITE.lock-pinned revisions
        run: |
          mkdir -p /tmp/siblings
          python3 -c "
          import tomllib, subprocess
          from pathlib import Path
          lock = tomllib.loads(Path('SUITE.lock').read_text())
          for name, info in lock['components'].items():
              repo = info['repo']
              rev = info['revision']
              dest = Path('/tmp/siblings') / name
              subprocess.run(['git', 'clone', '--quiet', f'https://github.com/{repo}.git', str(dest)], check=True)
              subprocess.run(['git', '-C', str(dest), 'checkout', rev], check=True)
              print(f'  {name} @ {rev[:8]}')
          "

      - name: Install regista (spine)
        run: pip install /tmp/siblings/regista

      - name: Install faces (agent-notes + dossier)
        run: pip install /tmp/siblings/agent-notes /tmp/siblings/dossier

      - name: Install agent-provenance (cairn)
        run: pip install /tmp/siblings/agent-provenance

      - name: Install agent-capability-broker
        run: pip install /tmp/siblings/agent-capability-broker

      - name: Verify feature matrix (strict)
        env:
          AGENT_SUITE_SIBLINGS_ROOT: /tmp/siblings
        run: python3 scripts/feature-probes.py --check --strict

      - name: Generate candidate inventory
        env:
          AGENT_SUITE_SIBLINGS_ROOT: /tmp/siblings
        run: |
          mkdir -p out
          agent-suite inventory --json > out/candidate-inventory.json
          cat out/candidate-inventory.json

      - name: Verify source_tree_converged
        run: |
          python3 -c "
          import json, sys
          with open('out/candidate-inventory.json') as f:
              inv = json.load(f)
          converged = inv.get('summary', {}).get('source_tree_converged', False)
          if not converged:
              print('ERROR: source_tree_converged is false — the release inventory', file=sys.stderr)
              print('does not prove a clean, tested source candidate (Sol round-3 #2).', file=sys.stderr)
              sys.exit(1)
          print('source_tree_converged: true')
          "

      # Gate 2 (release-board WI-2.3): build immutable wheels from the exact
      # SUITE.lock-pinned checkouts already validated above, so the manifest
      # records real wheel hashes and the release ships installable artifacts
      # — the candidate is no longer source-only. `build` comes from the
      # [dev] extras installed above. WI-035: agent-suite's own PEP 517
      # backend is now pinned exactly in its pyproject, and the umbrella wheel
      # it produces is a hashed manifest entry (`umbrella_artifact`) with a
      # version derived from the release board — it is no longer attached
      # unattested under a statically reused version.
      - name: Build component wheels from pinned checkouts
        run: |
          mkdir -p out/wheels
          for c in /tmp/siblings/*/; do
            if [ -f "$c/pyproject.toml" ]; then
              python3 -m build --wheel --outdir out/wheels "$c"
            elif [ -f "$c/daemon/pyproject.toml" ]; then
              # agent-wake's package lives in daemon/
              python3 -m build --wheel --outdir out/wheels "$c/daemon"
            fi
          done
          python3 -m build --wheel --outdir out/wheels .
          ls -l out/wheels

      # The release manifest is the release-time description of the candidate
      # (see the file-header note). It records the umbrella tag SHA (resolved
      # from the git tag that triggered this run), all six constituent source
      # SHAs from SUITE.lock, the regista version quad, the lock identity, and
      # the SHA-256 of each wheel built above from the pinned revisions.
      # WI-035: the tag, the release board, and the umbrella wheel version are
      # one identity in three grammars. Assert it here rather than assuming it:
      # a release cut as v1.0.0-rc.3 while the board still says 1.0.0-rc.2
      # would otherwise attach a wheel whose version names the wrong release.
      - name: Verify release identity (tag == release board == wheel version)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c "
          import json, os, sys
          from agent_suite import __version__
          from agent_suite.release_artifacts import pep440_release_version
          tag = os.environ['RELEASE_TAG']
          with open('data/release-board.json') as f:
              board_release = json.load(f)['release']
          expected_tag = f'v{board_release}'
          if tag != expected_tag:
              print(f'ERROR: tag {tag!r} does not match the release board '
                    f'identity {board_release!r} (expected {expected_tag!r})', file=sys.stderr)
              sys.exit(1)
          expected_version = pep440_release_version(board_release)
          if __version__ != expected_version:
              print(f'ERROR: agent_suite.__version__={__version__!r} is not the PEP 440 '
                    f'form of release {board_release!r} (expected {expected_version!r})',
                    file=sys.stderr)
              sys.exit(1)
          print(f'release identity: tag={tag} board={board_release} wheel={__version__}')
          "

      - name: Build release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          agent-suite release-manifest build --tag "$RELEASE_TAG" --wheels-dir out/wheels --json > out/release-manifest.json
          cat out/release-manifest.json

      - name: Verify manifest records every component wheel and the umbrella
        run: |
          python3 -c "
          import json, sys
          with open('out/release-manifest.json') as f:
              m = json.load(f)
          missing = [c['ident'] for c in m['constituents'] if not c['wheel_sha256']]
          if missing:
              print(f'ERROR: no wheel hash recorded for: {missing}', file=sys.stderr)
              sys.exit(1)
          # WI-035: the umbrella wheel is attached to the release, so it must be
          # attested like anything else the release ships.
          umbrella = m.get('umbrella_artifact')
          if not umbrella or not umbrella.get('wheel_sha256'):
              print('ERROR: no umbrella wheel hash recorded in the manifest', file=sys.stderr)
              sys.exit(1)
          print('all component wheels + the umbrella wheel hashed in manifest')
          print(f\"  umbrella {umbrella['wheel_filename']} sha256={umbrella['wheel_sha256'][:12]}...\")
          "

      # The manifest is the release's attestation of its own artifacts, so
      # re-verify it against the wheels on disk before either is attached.
      - name: Verify manifest hashes against the built wheels
        run: agent-suite release-manifest verify out/release-manifest.json --wheels-dir out/wheels

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # softprops/action-gh-release@v2
        with:
          files: |
            out/candidate-inventory.json
            out/release-manifest.json
            out/wheels/*.whl
