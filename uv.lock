    { name = "azure-keyvault-secrets", marker = "extra == 'azure'" },
    { name = "build", marker = "extra == 'dev'" },
    { name = "hatchling", marker = "extra == 'dev'" },
    { name = "hvac", marker = "extra == 'vault'" },
    { name = "mypy", marker = "extra == 'dev'" },
    { name = "pyjwt", extras = ["crypto"], marker = "extra == 'azure'" },
    { name = "pytest", marker = "extra == 'dev'" },
    { name = "pywin32", marker = "sys_platform == 'win32' and extra == 'windows'" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.16,<1" },
]
provides-extras = ["dev", "vault", "azure", "windows", "windows-full"]

