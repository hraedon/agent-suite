# Standalone distribution for the CLI contract v1 conformance kit (Plan 019 B1).
#
# ONE source of truth: src/agent_suite/conformance/ in this repo. This project
# builds that subtree into a tiny, publishable wheel — agent-suite-conformance —
# so sibling components depend on it as a normal pinned version
# (`agent-suite-conformance==X.Y`) instead of a git+SHA direct reference (which
# PyPI forbids in uploaded metadata, and which broke regista's 0.5.3 publish).
#
# The wheel ships only agent_suite/conformance/ with no agent_suite/__init__.py,
# so `agent_suite` resolves as a PEP 420 namespace in a consumer that installs
# ONLY this package. agent-suite proper is never published, so there is no
# regular-vs-namespace collision in practice.
#
# VERSION MUST EQUAL agent_suite.conformance.KIT_VERSION. The guard test
# tests/test_packaging.py fails CI if they drift.

[project]
name = "agent-suite-conformance"
version = "1.1.0"
description = "CLI contract v1 conformance kit for the agent suite (Plan 018 WI-2 / Plan 019 B1)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["agent-suite", "conformance", "cli-contract", "testing"]
dependencies = []  # stdlib-only, by design
# No authors/urls: matches the published sibling (regista) and avoids emitting
# a placeholder or a link to the private agent-suite repo on a public PyPI page.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The conformance source is force-included by the custom build hook
# (hatch_build.py): ONE source of truth (../../src/agent_suite/conformance), no
# symlink (Git for Windows core.symlinks=false materializes a link as a stray
# text file, silently shipping nothing) and no copy (the kit must not be
# duplicated). The hook resolves the source per build context — the canonical
# monorepo path for a source-tree build, the materialized local subtree for a
# wheel-from-sdist build — and ships itself + the README in the sdist so the
# wheel-from-sdist step is self-contained. See hatch_build.py for the logic.

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# The hook supplies the force-include; bypass-selection means the wheel ships
# ONLY what the hook force-includes (the conformance subtree), with no
# auto-detected packages. No agent_suite/__init__.py -> PEP 420 namespace.
bypass-selection = true
# Keep byte-caches out of the published artifact (the build test asserts pyc-free).
exclude = ["**/__pycache__", "**/*.py[cod]"]

[tool.hatch.build.targets.sdist]
# The hook force-includes the conformance subtree + hatch_build.py + README.
# bypass-selection keeps the sdist to the hook's force-includes plus the build
# metadata hatchling always adds (pyproject.toml, PKG-INFO); without it the
# default file selection would broaden the sdist.
bypass-selection = true
exclude = ["**/__pycache__", "**/*.py[cod]"]
