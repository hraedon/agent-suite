[project]
name = "agent-suite"
# Single-sourced from src/agent_suite/__init__.py, which is identity-checked
# against data/release-board.json's release (WI-035). Do not re-add a literal
# version here: two sources of the release identity is exactly the defect.
dynamic = ["version"]
description ="Deploy the agent suite as one system: bootstrap, compatibility lock, and health umbrella over regista + its faces."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "hraedon" }]
keywords = ["agent-suite", "orchestration", "bootstrap", "health-check", "deployment"]
dependencies = []  # stdlib-only core

[project.urls]
Repository = "https://github.com/hraedon/agent-suite"

[project.optional-dependencies]
dev = ["ruff>=0.16,<1", "mypy", "pytest", "build", "hatchling"]  # build+hatchling: conformance wheel build-test; ruff pinned to the 0.16 line with an explicit lint select (see [tool.ruff.lint])
vault = ["hvac"]                     # HashiCorp Vault secret backend (edge only)
azure = ["azure-identity", "azure-keyvault-secrets", "PyJWT[crypto]"]  # Azure Key Vault + Entra (edge only)
windows = ["pywin32; sys_platform == 'win32'"]        # DPAPI / Credential Manager (edge only)
windows-full = ["agent-suite[windows]", "agent-suite[azure]"]  # all Windows deps in one extra

[project.scripts]
agent-suite = "agent_suite.cli:main"

[build-system]
# Pinned exactly (WI-035): the PEP 517 backend is part of the wheel's byte
# identity, so an unpinned backend means two builds of the same source can
# produce different bytes and therefore different manifest wheel hashes.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agent_suite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_suite"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = "jwt.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Full-E family selection matching regista/cairn (E incl. E501 + F + I + N + W
# + UP + RUF), PLUS PLW — agent-suite is the suite's acting/orchestration layer,
# so it additionally enforces PLW1510 (subprocess.run must state `check=`
# explicitly) to keep silent component-CLI failures from looking like success.
# The noisy ruff-0.16 expanded defaults (TRY/BLE/SIM/S) remain excluded.
select = ["E", "F", "I", "N", "W", "UP", "RUF", "PLW"]

[tool.pytest.ini_options]
testpaths = ["tests"]
